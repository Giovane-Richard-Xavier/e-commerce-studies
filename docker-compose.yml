version: '3.9'

services:
  app:
    build:
      context: .

    container_name: ecommerce_study_app

    entrypoint: /home/node/app/.docker/entrypoint.sh

    ports:
      - '3001:3001'

    volumes:
      - .:/home/node/app:delegated
      - node_modules_app:/home/node/app/node_modules

    depends_on:
      db:
        condition: service_healthy

    networks:
      - main-network

    environment:
      NODE_ENV: ${NODE_ENV}
      DATABASE_URL: ${DATABASE_URL}

  db:
    build: .docker/postgres

    container_name: ecommerce_study_db

    restart: always

    ports:
      - '5432:5432'

    volumes:
      - .docker/dbdata:/var/lib/postgresql/data

    networks:
      - main-network

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}'
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  pgadmin4:
    image: dpage/pgadmin4

    container_name: ecommerce_study_pgadmin

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}

    ports:
      - '15432:80'

    depends_on:
      db:
        condition: service_healthy

    networks:
      - main-network

    restart: unless-stopped

volumes:
  node_modules_app:

networks:
  main-network:
